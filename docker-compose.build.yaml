# Build-only compose. Builds the image and tags it for the kremlit registry.
# As of the 2026-06-08 kurama→hachibi migration, build + registry + runtime are
# ALL on hachibi, so build directly there — NO cross-host image transfer, and
# NO ROUTE FROM THE MAC, EVER (zero image bytes may transit the local machine):
#   hachibi: cd /home/sadewa/serp-build && git fetch && git checkout -f feat/api-niche-classifier
#   hachibi: docker compose -f docker-compose.build.yaml build
#   hachibi: docker tag …:v0.9.7-niche localhost:32769/foxhound-serp-scraper:v0.9.7-niche
#   hachibi: docker push localhost:32769/foxhound-serp-scraper:v0.9.7-niche
#          (push runs ON hachibi → no Traefik, no auth, no 60s upload timeout)
# (Legacy kurama build path: docker save | gzip → scp kurama→hachibi → load → push.)
#
# Tag produced (foxhound v0.0.27 — REAL TLS-renegotiation panic fix per issue #43;
# v0.0.22/v0.0.24 both still panicked. Plus niche feature):
#   ghcr.mcpke.dev/foxhound-serp-scraper:v0.9.7-niche
# v0.8.5-niche = v0.8.4-niche + port of #36 (v2 keyset cursor reachable #32 +
#   honest reenrich healthcheck #28), cherry-picked from main onto the niche line.
# v0.8.6-niche = v0.8.5-niche + #39 (drain stuck-processing queries backlog:
#   heal limit 5000, requeue-score invariant #3 fix, snapshot statement_timeout
#   invariant #2 fix, partial idx_queries_processing_updated, off-target guard).
# v0.8.7-niche = v0.8.6-niche + Phase 1 doom-loop fix: advisory-lock Migrate()
#   (serialize the boot DDL herd), idempotent trigger bindings (no per-boot ACCESS
#   EXCLUSIVE on serp_results/enrichment_jobs), progress-based reenrich health
#   (stop the autoheal flap), exclude YA synthetic domains from reenrich,
#   idx_emails_acceptable_score.
# v0.8.8-niche = v0.8.7 + critical fix: SET statement_timeout=0 on the migrate
#   connection so pg_advisory_lock can wait past 60s (v0.8.7 crash-looped every
#   non-first container with 57014 and took the manager API down) + Phase 3 (SKIP
#   LOCKED reconciler, statement_timeout guards, KEYS→SCAN, queue-score UnixMicro
#   unit fix) + Phase 5 (idx_bl_created_at/updated_at/category, idx_be_email_id,
#   email_provider→e.domain, category/source filters, v1 N+1 kill) + Phase 7
#   (UTF-8 sanitize before reenrich upsert).
# v0.8.9-niche = v0.8.8 + Phase 1D PROPER fix: precomputed business_listings
#   .completeness_score (maintained by trg_normalize_enrichment + a one-time
#   background backfill) so the reenrich eligibility query filters on the indexed
#   idx_bl_reenrich_score instead of a per-candidate correlated EXISTS (the
#   2026-06-02 eligibility timeout storm). Also declares idx_bl_category_offniche
#   + idx_be_source (already applied live) for fresh-deploy parity.
#   NOTE: first manager boot runs the completeness backfill in the BACKGROUND
#   (non-blocking); reenrich eligibility ramps up as rows get scored.
# v0.9.0-niche = v0.8.9 + category-quality + backfill-hardening:
#   • schema.org @type denylist — trg_normalize_enrichment now flags off_niche
#     for content/junk @types (Article, FAQPage, WPHeader, …) always, and for
#     generic/blank business @types (Organization, LocalBusiness, " ", …) only
#     when the keyword classifier found nothing (niche_category IS NULL), so the
#     category dimension stops surfacing schema.org noise. Existing rows cleaned
#     by BackfillSchemaTypeDenylist (background, backup-first to
#     business_listings_schematype_backup_20260602, batched, version-gated).
#   • BackfillCompletenessScore rewritten batched + correlated-EXISTS (the v0.8.9
#     monolith hash-joined all business_emails⋈emails and ran 766s, starving IO
#     + the API + reenrich eligibility — root cause of the 2026-06-02 churn).
#   • Aggressive per-table autovacuum on business_listings (storage params,
#     online) keeps the visibility map fresh so the index-only ?category= COUNT
#     stays ~100ms (was degrading to ~72K heap fetches → 6–16s/500s).
#   Already applied LIVE before this build: rebuilt invalid idx_bl_reenrich_score,
#   VACUUM business_listings, autovacuum params.
# v0.9.1-niche = v0.9.0 + enrich completion-error stranding fix (dev-squad evolve #1):
#   • enrich.go completion UPDATE now sanitizeUTF8()-wraps every scraped text field
#     (reenrich.go already did; enrich didn't) — a single invalid byte no longer
#     fails the whole write and strands a fully-extracted page (~18k UTF-8 failures).
#   • enrich.go completion-error fallback now increments attempt_count + sets
#     next_attempt_at (caps to 'dead' at max_attempts) so the reconciler's
#     resurrection query (next_attempt_at IS NOT NULL AND <= NOW()) can pick it up;
#     the old form left next_attempt_at NULL → ~19,948 jobs permanently stranded.
#   POST-DEPLOY: one-time online re-queue of the existing stranded jobs
#     (status='failed', next_attempt_at NULL, completion-update-failed) so they
#     re-write cleanly through the new sanitized path.
# v0.9.2-niche = v0.9.1 + category_stats matview (fix /api/v2/results/categories
#   500 @ 5.3s): per-category business+email counts are precomputed into a
#   materialized view (created WITH NO DATA so boot DDL stays instant) and
#   refreshed every 10min off the request path by a manager-only background loop
#   (RefreshCategoryStatsLoop). The handler reads top-100 from it instead of the
#   live 5.7s aggregation (business_listings ⋈ business_emails, GROUP BY 136K
#   free-text categories, 2× COUNT(DISTINCT)) that blew the 5s API
#   statement_timeout (Invariant #2). First refresh seeds via a plain REFRESH,
#   then REFRESH … CONCURRENTLY so API reads never block.
#   NOTE: on first boot the endpoint returns an empty list (200) for the few
#   seconds until the seed completes — it is NOT a 500.
# v0.9.3-niche = v0.9.2 + category_stats seed-detection fix: REFRESH … CONCURRENTLY
#   on an unpopulated matview raises SQLSTATE 0A000 (feature_not_supported), NOT
#   55000 — so v0.9.2's isMatviewNotPopulated() missed it, the plain-REFRESH seed
#   fallback was skipped, and category_stats stayed empty on a fresh deploy (the
#   handler returned an empty 200 instead of data). Now matches 0A000 too, in both
#   the api handler and the db refresh loop. (Live v0.9.2 prod was hot-fixed with a
#   manual REFRESH; this makes a cold/fresh deploy self-seed correctly.)
# v0.9.4-niche = v0.9.3 + category-quality for the categories endpoint (kill the
#   schema.org @type noise):
#   • category_stats REDEFINED (versioned DROP+recreate, derived data — safe):
#     groups by the EFFECTIVE category COALESCE(niche_category, category) and
#     EXCLUDES off_niche rows. Top of the list is now yoga/yoga studio/fitness/
#     spa/bikram yoga/... instead of Organization/FAQPage/Article. Definition
#     body is the shared categoryStatsSelect const (schema + migration use the
#     same string — no drift possible).
#   • One-shot drift heal (backup-first to
#     business_listings_offniche_drift_backup_20260610): 6,959 active rows with
#     SPECIFIC off-niche @types (Hotel, MedicalBusiness, Dentist, ...) created
#     2026-04/05 before full trigger/backfill coverage are flagged off_niche=TRUE
#     per the trigger's unconditional list-1 semantics. Verified historical-only
#     (zero drifted rows created after 2026-06-01).
#   • Handler also treats 42P01 (matview missing during the DROP+recreate
#     window) as warm-up → empty 200, not a 500.
# v0.9.5-niche = v0.9.4 + GEO LINEAGE (first slice of the v4 normalized schema,
#   docs/foxhound-schema-normalized.md). Fixes the 86%-country-empty /
#   88%-city-empty gap (599,982 / 612,866 of 697K active rows; Indonesia
#   "missing" despite 44K+ Jakarta/Bali queries — attribution was lost, not
#   coverage):
#   • NEW lookup tables: countries (ISO-3166-1 alpha-2 + enabled) and
#     geo_cities (city_lower → city, country_code FK) — normalized out of
#     wellness.go, seeded idempotently by the manager at boot.
#   • queries: new city column; InsertBatch now resolves country (ISO-2) +
#     city at INSERT time via a lateral longest-token match against geo_cities
#     — covers generate, import, telegram, API, and auto-expansion in one
#     place. Lineage can never be dropped again.
#   • business_listings: new country_code CHAR(2) (v4 FK-ready) + geo_source
#     (NULL = page-extracted, 'query_inference' = inherited). trg_normalize_
#     enrichment inherits the query's geo when the page yields none; extraction
#     ALWAYS beats inference on upsert.
#   • Background one-shot backfills (manager, version-gated, id-windowed,
#     resumable): BackfillQueryGeo (3.45M queries via single-regex city
#     alternation), BackfillListingGeoInherit (~582K listings from source
#     query), BackfillListingCountryCode (~97K legacy full-name → ISO-2).
#   • API: listings expose country_code + geo_source; ?country= now accepts
#     BOTH the full name (Indonesia) and ISO-2 (ID).
#   All trigger/insert SQL pre-validated against prod PG15 via session-scoped
#   pg_temp objects (zero footprint).
# v0.9.6-niche = v0.9.5 + Swagger docs + geo-backfill hardening:
#   • NEW GET /api/docs (Swagger UI) + GET /api/openapi.yaml (OpenAPI 3.0 spec,
#     embedded at build time so served docs always match the binary). Both
#     public (auth-skip alongside /api/health); spec covers v1+v2 surfaces,
#     both auth schemes, all /api/v2/results filters, and the v0.9.5 geo
#     fields (country_code, geo_source).
#   • Geo backfills now RETRY transient lock conflicts (40P01/40001/55P03,
#     3 attempts, linear backoff) and CONTINUE past a persistently failed
#     window instead of aborting the pass; version recorded only on a clean
#     pass so skipped windows re-walk next boot. (v0.9.5 first pass died at
#     window 3.35M on a deadlock with 1.48M/3.45M queries filled — this boot
#     resumes and completes it.)
#   • Removed the superseded one-shot "geo_recovery_listings_country"
#     unbatched boot-path migration (already recorded as a no-op in prod;
#     BackfillListingGeoInherit is the real implementation).
#
# v0.9.7-niche = v0.9.6 + niche lineage backfill + country ISO/alias completion:
#   • BackfillListingNicheInherit — recovers ~338K active listings with NULL
#     niche_category by applying the trigger's niche buckets to the source query
#     text (lineage), id-windowed/resumable/version-gated, manager-only. Bucket-
#     less PersonalNiches (hypnotherapist, personal trainer, …) left NULL — no
#     new buckets (product decision).
#   • countries lookup completed to full ISO names + 26 missing countries (China,
#     Russia, Ukraine, … + AE "UAE"→"United Arab Emirates"); fixes the live
#     trigger resolution too. CountryAliases + BackfillListingCountryCodeAliases
#     re-maps ~5,698 code-less rows (validated vs ISO-3166 whitelist, invariant #6).
#   • niche_source column + ON CONFLICT precedence: a fresh page-extracted niche
#     supersedes a query-inferred one (mirrors geo_source), not COALESCE-sticky.
#     ayurveda bucket regex fixed (\mayurved\M → \mayurved prefix; was dead).
#   • BackfillCountryDisplayCanonical normalizes inferred display names to the
#     canonical countries.name (the AE "UAE" drift); page-extracted untouched.
#   All migrations version-gated + background → no boot blocking.
#
# Deploy: set IMAGE_TAG=v0.9.7-niche on the serp stack and redeploy.

services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.mcpke.dev/foxhound-serp-scraper:v0.9.7-niche
    # Override Dockerfile ENTRYPOINT so the container exits 0 once the image is
    # built (we only produce the image layer set here; we don't run the binary).
    entrypoint: [""]
    command: ["true"]
    restart: "no"
