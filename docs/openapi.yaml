  # =========================================================================
  # V1 — Queries
  # =========================================================================

  /api/queries:
    get:
      summary: "V1 – List queries"
      operationId: v1ListQueries
      tags: [V1 Queries]
      description: "Paginated list of SERP queries. Role: **viewer**."
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [new, processing, completed, failed]
          description: "Filter by query status."
        - $ref: '#/components/parameters/SearchParam'
      responses:
        "200":
          description: "Paginated queries."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/V1QueryRow'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/V1InternalError'

    post:
      summary: "V1 – Create queries"
      operationId: v1CreateQueries
      tags: [V1 Queries]
      description: |
        Inserts search queries. Duplicates (same normalised text) are silently
        skipped. Role: **admin**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queries]
              properties:
                queries:
                  type: array
                  items:
                    type: string
                  maxItems: 500
            example:
              queries: ["yoga studio jakarta", "pilates class berlin"]
      responses:
        "201":
          description: "Insert summary."
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
                  duplicates:
                    type: integer
                  total:
                    type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/V1InternalError'

    delete:
      summary: "V1 – Delete queries by IDs"
      operationId: v1DeleteQueries
      tags: [V1 Queries]
      description: "Deletes queries by IDs. Max 1000 IDs. Role: **admin**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
