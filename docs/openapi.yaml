              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  maxItems: 1000
      responses:
        "200":
          description: "Delete count."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/V1InternalError'

  /api/queries/generate:
    post:
      summary: "V1 – Generate queries for a country"
      operationId: v1GenerateQueries
      tags: [V1 Queries]
      description: |
        Generates wellness/fitness keyword queries for the given country and
        inserts them into the `queries` table. Pass `"all"` to generate for all
        supported countries. Role: **admin**.
      requestBody:
