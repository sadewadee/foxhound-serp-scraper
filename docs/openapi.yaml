              api_key: "sk-..."
      responses:
        "200":
          description: "Token issued (V2 envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expires_in:
                        type: integer
                        example: 86400
                      user:
                        type: object
                        properties:
                          username:
                            type: string
                          role:
                            type: string
                            enum: [admin, viewer]
        "400":
          description: "Malformed request body."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
        "401":
          description: "Invalid API key."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
