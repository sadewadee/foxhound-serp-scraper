  # =========================================================================
  # V2 — Auth (public)
  # =========================================================================

  /api/v2/auth/login:
    post:
      summary: "V2 – Login with API key"
      operationId: v2Login
      tags: [V2 Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key:
                  type: string
