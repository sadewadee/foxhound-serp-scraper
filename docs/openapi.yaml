            value: {"error": {"code": "invalid_key", "message": "invalid API key"}}

  /api/v2/auth/refresh:
    post:
      summary: "V2 – Refresh token"
      operationId: v2Refresh
      tags: [V2 Auth]
      description: "Generates a new 24-hour token for the currently authenticated user."
      responses:
        "200":
          description: "New token (V2 envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expires_in:
                        type: integer
                        example: 86400
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "500":
          $ref: '#/components/responses/V2InternalError'

  # =========================================================================
  # V2 — Health (public)
  # =========================================================================

  /api/v2/health:
    get:
      summary: "V2 – Health check"
      operationId: v2Health
      tags: [V2 Health]
      security: []
      responses:
        "200":
          description: "All dependencies healthy."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [ok, degraded]
                      postgres:
                        type: string
                        enum: [ok, error]
                      redis:
                        type: string
                        enum: [ok, error]
              example:
                data:
                  status: ok
                  postgres: ok
                  redis: ok
        "503":
          description: "One or more dependencies degraded."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  # =========================================================================
  # V2 — Results
  # =========================================================================

  /api/v2/results:
    get:
      summary: "V2 – List business listings"
      operationId: v2ListResults
      tags: [V2 Results]
      description: |
        Returns paginated `business_listings` with full email validation data.

        ## Pagination modes

        **OFFSET mode** (default): use `page` + `per_page` + optional `sort`.
        The response includes `meta.total` (may be `0` with `total_known=false`
        if the COUNT(*) query timed out). An optional `next_cursor` in `meta`
        lets the client switch to keyset mode to escape deep-OFFSET timeouts.

        **Cursor / keyset mode**: when `cursor` is present, the response is
        `{data, next_cursor, has_more}` — no `meta.total`. O(log N) at any
        depth. `sort` is ignored (always `id DESC`).

        ## Default filter

        `off_niche=true` rows are **excluded by default**. Pass
        `include_off_niche=true` to see them.

        Role: **viewer**.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/CursorDirParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/DomainFilterParam'
        - $ref: '#/components/parameters/HasEmailParam'
        - $ref: '#/components/parameters/EmailParam'
        - $ref: '#/components/parameters/EmailProviderParam'
        - $ref: '#/components/parameters/EmailStatusParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/CityParam'
        - $ref: '#/components/parameters/HasPhoneParam'
        - $ref: '#/components/parameters/HasSocialParam'
        - $ref: '#/components/parameters/IncludeOffNicheParam'
        - $ref: '#/components/parameters/NicheParam'
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/SourceParam'
      responses:
        "200":
          description: |
            OFFSET mode → `{data:[...], meta:{...}}`.
            Cursor mode → `{data:[...], next_cursor:"...", has_more:true|false}`.
          content:
            application/json:
              schema:
                oneOf:
                  - description: "OFFSET mode"
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/V2BusinessListing'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
                  - $ref: '#/components/schemas/V2CursorEnvelope'
        "400":
          description: |
            Invalid cursor (`invalid_cursor`) or deep OFFSET timeout
            (`offset_too_deep`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
          examples:
            invalid_cursor:
              value:
                error:
                  code: "invalid_cursor"
                  message: "cursor is malformed"
            offset_too_deep:
              value:
                error:
                  code: "offset_too_deep"
                  message: "this page is too deep to fetch by offset under load; switch to keyset pagination using the next_cursor returned on a shallower page"
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

    delete:
      summary: "V2 – Delete results by IDs or domain"
      operationId: v2DeleteResults
      tags: [V2 Results]
      description: |
        Permanently deletes `business_listings` rows. Role: **admin**.
        Provide either `ids` or `domain` — not both. Max 1000 IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  maxItems: 1000
                domain:
                  type: string
              description: "Exactly one of `ids` or `domain` must be provided."
            examples:
              byIds:
                value: {"ids": [123, 456]}
              byDomain:
                value: {"domain": "spammer.com"}
      responses:
        "200":
          description: "Deleted count."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        format: int64
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
          examples:
            missing_params:
              value: {"error": {"code": "missing_params", "message": "provide ids or domain"}}
            too_many_ids:
              value: {"error": {"code": "too_many_ids", "message": "max 1000 ids per request"}}
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

  /api/v2/results/stats:
    get:
      summary: "V2 – Results statistics"
      operationId: v2ResultsStats
      tags: [V2 Results]
      description: |
        Aggregate stats for `business_listings` and `emails` tables.
        Role: **viewer**.
      responses:
        "200":
          description: "Results stats (V2 single envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/V2ResultsStats'
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

  /api/v2/results/count:
    get:
      summary: "V2 – Count filtered results"
      operationId: v2ResultsCount
      tags: [V2 Results]
      description: |
        Returns a filtered COUNT(*) against `business_listings` with the same
        filter parameters as `GET /api/v2/results`. Cached for 60 seconds.

        When the COUNT(*) times out, returns `{"data":{"count":0,"count_known":false}}`
        instead of HTTP 500 so polling clients don't retry in a tight loop.

        Role: **viewer**.
      parameters:
        - $ref: '#/components/parameters/DomainFilterParam'
        - $ref: '#/components/parameters/HasEmailParam'
        - $ref: '#/components/parameters/EmailParam'
        - $ref: '#/components/parameters/EmailProviderParam'
        - $ref: '#/components/parameters/EmailStatusParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/CityParam'
        - $ref: '#/components/parameters/HasPhoneParam'
        - $ref: '#/components/parameters/HasSocialParam'
        - $ref: '#/components/parameters/IncludeOffNicheParam'
        - $ref: '#/components/parameters/NicheParam'
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/SourceParam'
      responses:
        "200":
          description: "Count result."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [count, count_known]
                    properties:
                      count:
                        type: integer
                        description: "`0` when `count_known=false`."
                      count_known:
                        type: boolean
                        description: "`false` when the COUNT(*) timed out."
              examples:
                known:
                  value: {"data": {"count": 12345, "count_known": true}}
                unknown:
                  value: {"data": {"count": 0, "count_known": false}}
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'

  /api/v2/results/categories:
    get:
      summary: "V2 – Categories with business and email counts"
      operationId: v2ResultsCategories
      tags: [V2 Results]
      description: |
        Top 100 non-empty categories by business count.
        Role: **viewer**.
      responses:
        "200":
          description: "Category list (V2 single envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/V2CategoryStats'
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

  /api/v2/results/domains:
    get:
      summary: "V2 – Domains with email counts"
      operationId: v2ResultsDomains
      tags: [V2 Results]
      description: |
        Top 500 domains by email count across all `business_listings`.
        Role: **viewer**.
      responses:
        "200":
          description: "Domain list (V2 single envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/V2DomainStats'
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

  /api/v2/results/download:
    get:
      summary: "V2 – Download / export results"
      operationId: v2ResultsDownload
      tags: [V2 Results]
      description: |
        Streaming export of filtered `business_listings` with full email data.
        Uses keyset pagination (1000 rows/batch) internally to avoid OOM on
        large exports. Timeout is 5 minutes (vs 18s for normal endpoints).

        Supports the same filter parameters as `GET /api/v2/results`.
        No cursor or sort parameters — always exports ascending by `id`.

        Role: **viewer**.

        CSV columns:
        `id,business_name,category,niche_category,off_niche,domain,website,
        address,location,phone,emails,email_count,valid_email_count,created_at`
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: "Output format. `json` → streaming JSON array. `csv` → CSV file."
        - $ref: '#/components/parameters/DomainFilterParam'
        - $ref: '#/components/parameters/HasEmailParam'
        - $ref: '#/components/parameters/EmailParam'
        - $ref: '#/components/parameters/EmailProviderParam'
        - $ref: '#/components/parameters/EmailStatusParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/CityParam'
        - $ref: '#/components/parameters/HasPhoneParam'
        - $ref: '#/components/parameters/HasSocialParam'
        - $ref: '#/components/parameters/IncludeOffNicheParam'
        - $ref: '#/components/parameters/NicheParam'
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/SourceParam'
      responses:
        "200":
          description: |
            Streaming JSON array or CSV.

            JSON: `Content-Type: application/json`,
                  `Content-Disposition: attachment; filename=results.json`

            CSV: `Content-Type: text/csv`,
                 `Content-Disposition: attachment; filename=results.csv`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/V2BusinessListing'
            text/csv:
              schema:
                type: string
        "400":
          description: "Invalid format parameter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
          example:
            value: {"error": {"code": "invalid_format", "message": "format must be json or csv"}}
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'

  # =========================================================================
  # V2 — Dashboard stats
  # =========================================================================

  /api/v2/stats:
    get:
      summary: "V2 – Dashboard stats"
      operationId: v2DashboardStats
      tags: [V2 Dashboard]
      description: |
        Full dashboard aggregation: query status rollup, SERP job counts, enrich
        job counts, email/provider stats, Redis queue depths.
        Cached in Redis for 30 seconds with single-flight to prevent thundering
        herd. Role: **viewer**.
      responses:
        "200":
          description: "Dashboard stats (V2 envelope; `data` is the inner object)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      queries:
                        type: object
                        additionalProperties:
                          type: integer
                        description: "Status counts (new, processing, completed, failed) + `total`."
                      serp:
                        type: object
                        properties:
                          total:
                            type: integer
                          pending:
                            type: integer
                          processing:
                            type: integer
                          completed:
                            type: integer
                          failed:
                            type: integer
                          urls_found:
                            type: integer
                          rate_per_hour:
                            type: integer
                          today:
                            type: integer
                      enrich:
                        type: object
                        properties:
                          total:
                            type: integer
                          pending:
                            type: integer
                          processing:
                            type: integer
                          completed:
                            type: integer
                          failed:
                            type: integer
                          dead:
                            type: integer
                          rate_per_hour:
                            type: integer
                          today:
                            type: integer
                      results:
                        type: object
                        properties:
                          total_emails:
                            type: integer
                          emails_today:
                            type: integer
                          emails_per_hour:
                            type: integer
                          unique_domains:
                            type: integer
                          providers:
                            type: object
                            additionalProperties:
                              type: integer
                      queues:
                        type: object
                        additionalProperties:
                          type: integer
                          format: int64
                        description: "Redis key → depth. Keys: `serp:queue:queries`, `serp:buffer`, `enrich:buffer`."
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

  # =========================================================================
  # V2 — Queries
  # =========================================================================

  /api/v2/queries:
    get:
      summary: "V2 – List queries"
      operationId: v2ListQueries
      tags: [V2 Queries]
      description: |
        Paginated list of SERP queries. COUNT is Redis-cached for 60s.
        `meta.total_known=false` when COUNT timed out. Role: **viewer**.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [new, processing, completed, failed]
          description: "Filter by query status."
        - $ref: '#/components/parameters/SearchParam'
      responses:
        "200":
          description: "Paginated queries (V2 envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        text:
                          type: string
                        status:
                          type: string
                        result_count:
                          type: integer
                        error:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

    post:
      summary: "V2 – Create queries"
      operationId: v2CreateQueries
      tags: [V2 Queries]
      description: |
        Inserts search queries. Duplicates (same normalised text) are silently
        skipped. Max 500 queries per request. Role: **admin**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queries]
              properties:
                queries:
                  type: array
                  items:
                    type: string
                  maxItems: 500
            example:
              queries: ["yoga studio jakarta", "pilates class berlin"]
      responses:
        "200":
          description: "Insert summary (V2 single envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      inserted:
                        type: integer
                      duplicates:
                        type: integer
                      total:
                        type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

    delete:
      summary: "V2 – Delete queries by IDs"
      operationId: v2DeleteQueries
      tags: [V2 Queries]
      description: "Deletes queries by IDs. Max 1000 IDs. Role: **admin**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  maxItems: 1000
      responses:
        "200":
          description: "Delete count (V2 single envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                        format: int64
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

  /api/v2/queries/generate:
    post:
      summary: "V2 – Generate queries for a country"
      operationId: v2GenerateQueries
      tags: [V2 Queries]
      description: |
        Generates wellness/fitness keyword queries for the given country and
        inserts them. Pass `"all"` for all countries. Role: **admin**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country]
              properties:
                country:
                  type: string
                  description: "Country name (e.g. `Indonesia`) or `\"all\"`."
            example:
              country: "Indonesia"
      responses:
        "200":
          description: "Generation summary (V2 single envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      country:
                        type: string
                      generated:
                        type: integer
                      inserted:
                        type: integer
                      duplicates:
                        type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Error'
          examples:
            country_not_found:
              value: {"error": {"code": "country_not_found", "message": "country not found"}}
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

  /api/v2/queries/retry:
    post:
      summary: "V2 – Retry failed queries"
      operationId: v2RetryQueries
      tags: [V2 Queries]
      description: "Resets `status='failed'` queries back to `'new'`. Role: **admin**."
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Retry count (V2 single envelope)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      retried:
                        type: integer
        "401":
          $ref: '#/components/responses/V2Unauthorized'
        "403":
          $ref: '#/components/responses/V2Forbidden'
        "500":
          $ref: '#/components/responses/V2InternalError'

tags:
  - name: V1 Auth
    description: "Legacy v1 authentication (no envelope wrapper)."
  - name: V1 Health
    description: "Legacy v1 health check."
  - name: V1 Contacts
    description: "Legacy v1 contacts / business listings."
  - name: V1 Domains & Categories
    description: "Legacy v1 domain and category lookups."
  - name: V1 Queries
    description: "Legacy v1 SERP query management."
  - name: V1 Pipeline
    description: "Legacy v1 pipeline stats and control."
  - name: V1 Debug
    description: "V1 debug endpoints for raw job inspection."
  - name: V2 Auth
    description: "V2 authentication (envelope-wrapped responses)."
  - name: V2 Health
    description: "V2 health check."
  - name: V2 Results
    description: "V2 business listings — primary consumer surface."
  - name: V2 Dashboard
    description: "V2 dashboard aggregation."
  - name: V2 Queries
    description: "V2 SERP query management."
