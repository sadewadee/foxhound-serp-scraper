        content:
          application/json:
            schema:
              type: object
              required: [country]
              properties:
                country:
                  type: string
                  description: "Country name (e.g. `Indonesia`) or `\"all\"`."
            example:
              country: "Indonesia"
      responses:
        "201":
          description: "Generation summary."
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                  generated:
                    type: integer
                  inserted:
                    type: integer
                  duplicates:
                    type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Error'
          examples:
            country_not_found:
              value: {"error": "country not found"}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/V1InternalError'

  /api/queries/retry:
    post:
      summary: "V1 – Retry failed queries"
      operationId: v1RetryQueries
      tags: [V1 Queries]
      description: "Resets `status='failed'` queries back to `'new'`. Role: **admin**."
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Retry count."
          content:
            application/json:
              schema:
                type: object
                properties:
                  retried:
                    type: integer
