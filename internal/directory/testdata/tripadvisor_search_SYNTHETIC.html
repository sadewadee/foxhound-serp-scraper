<!--

  extension), so this module has never parsed a real TripAdvisor response.
  This markup is modeled on TripAdvisor's documented public structure to
  exercise the selectors in internal/directory/tripadvisor.go. Every business
  name, address, phone, and URL here is invented. The "To verify on
  activation" checklist in docs/directory-datadome.md lists what must be
  confirmed against live pages before DIRECTORY_DATADOME_ENABLED=1.
-->
<html>
<body>
  <div data-test-target="restaurants-list">
    <div>
      <a class="property_title result-title" href="/Restaurant_Review-g294343-d12345">Spice Garden Ubud</a>

      <div class="ui_bubble_rating bubble_45" aria-label="4.5 of 5 bubbles"></div>
      <span class="cuisine">Indonesian</span>

      <a class="property_title result-title" href="/Attraction_Review-g297629-d67890">Ocean View Point</a>
